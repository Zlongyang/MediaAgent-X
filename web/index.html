<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaAgent-X · Agent 工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='rgb(15,17,21)'/%3E%3Cg stroke='white' stroke-width='3.4' stroke-linecap='round'%3E%3Cline x1='24' y1='24' x2='10.5' y2='10.5'/%3E%3Cline x1='24' y1='24' x2='37.5' y2='10.5'/%3E%3Cline x1='24' y1='24' x2='10.5' y2='37.5'/%3E%3Cline x1='24' y1='24' x2='37.5' y2='37.5'/%3E%3C/g%3E%3Cg fill='white'%3E%3Ccircle cx='10.5' cy='10.5' r='3.4'/%3E%3Ccircle cx='37.5' cy='10.5' r='3.4'/%3E%3Ccircle cx='10.5' cy='37.5' r='3.4'/%3E%3Ccircle cx='37.5' cy='37.5' r='3.4'/%3E%3Ccircle cx='24' cy='24' r='5.6'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <script>
      // Set theme before first paint: localStorage wins (dark/light/system),
      // default system → follow OS.
      (function () {
        var t = null;
        try { t = localStorage.getItem('max-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light' && t !== 'system') t = 'system';
        var dark =
          t === 'dark' ||
          (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.body.setAttribute('data-ds-dark-theme', '');
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
