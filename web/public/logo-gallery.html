<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediaAgent-X · Logo 方案画廊</title>
<style>
  :root {
    --ink: rgb(15, 17, 21);
    --ink-2: rgb(97, 102, 107);
    --ink-3: rgb(129, 133, 140);
    --line: rgba(0, 0, 0, 0.1);
    --bg: rgb(249, 250, 251);
    --card: rgb(255, 255, 255);
    --dark: rgb(21, 21, 23);
    --dark-ink: rgb(249, 250, 251);
    --brand: rgb(65, 118, 230);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 48px 24px 80px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header h1 { font-size: 22px; font-weight: 600; }
  header p { margin-top: 6px; font-size: 14px; color: var(--ink-3); }
  .grid {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; }
  .tile {
    display: grid;
    place-items: center;
    height: 180px;
  }
  .tile.light { background: #fff; color: var(--ink); }
  .tile.dark { background: var(--dark); color: var(--dark-ink); }
  .tile.brand { background: #fff; color: var(--brand); }
  .tile.brandd { background: var(--dark); color: rgb(103, 158, 254); }
  .meta { padding: 14px 16px 16px; border-top: 1px solid var(--line); }
  .meta h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .num {
    display: inline-grid;
    place-items: center;
    width: 22px; height: 22px;
    border-radius: 7px;
    background: var(--brand);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .meta p { margin-top: 6px; font-size: 13px; line-height: 20px; color: var(--ink-2); }
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    color: var(--ink);
  }
  .sizes span { font-size: 11px; color: var(--ink-3); display: block; text-align: center; margin-top: 4px; }
  /* 侧栏实景 */
  .mockTitle { margin: 40px 0 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .mockStrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .mockSide {
    display: flex; align-items: center; gap: 10px;
    background: rgb(250, 250, 251);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px; font-weight: 600;
  }
  .mockSide.dark { background: rgb(27, 27, 28); color: var(--dark-ink); border-color: rgba(255,255,255,0.08); }
  .mockSide .lbl { font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: auto; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 1 对向播放键：两个相对的三角形构成 X 负形 -->
    <symbol id="logo-1" viewBox="0 0 48 48">
      <path d="M11 10.5v27L23.2 24 11 10.5Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M37 10.5v27L24.8 24 37 10.5Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    </symbol>
    <!-- 2 节点网络 X：总编调度四个工种 -->
    <symbol id="logo-2" viewBox="0 0 48 48">
      <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
        <line x1="24" y1="24" x2="10.5" y2="10.5"/>
        <line x1="24" y1="24" x2="37.5" y2="10.5"/>
        <line x1="24" y1="24" x2="10.5" y2="37.5"/>
        <line x1="24" y1="24" x2="37.5" y2="37.5"/>
      </g>
      <circle cx="10.5" cy="10.5" r="3.4" fill="currentColor"/>
      <circle cx="37.5" cy="10.5" r="3.4" fill="currentColor"/>
      <circle cx="10.5" cy="37.5" r="3.4" fill="currentColor"/>
      <circle cx="37.5" cy="37.5" r="3.4" fill="currentColor"/>
      <circle cx="24" cy="24" r="5.6" fill="currentColor"/>
    </symbol>
    <!-- 3 光圈快门 -->
    <symbol id="logo-3" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="16.5" fill="none" stroke="currentColor" stroke-width="4"/>
      <g stroke="currentColor" stroke-width="4" stroke-linecap="round">
        <line x1="24" y1="24" x2="24" y2="8.5"/>
        <line x1="24" y1="24" x2="37.4" y2="31.7"/>
        <line x1="24" y1="24" x2="10.6" y2="31.7"/>
      </g>
    </symbol>
    <!-- 4 电波播放：内容 + 分发 -->
    <symbol id="logo-4" viewBox="0 0 48 48">
      <path d="M13.5 15.5v17L26.5 24 13.5 15.5Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M30.5 17.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M36 12a16.5 16.5 0 0 1 0 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
    </symbol>
    <!-- 5 场记板 -->
    <symbol id="logo-5" viewBox="0 0 48 48">
      <path d="M9.5 15.5 38.8 11a2.4 2.4 0 0 1 2.7 2l.4 3.4a2.4 2.4 0 0 1-2 2.7l-29.3 4.4a2.4 2.4 0 0 1-2.7-2l-.4-3.4a2.4 2.4 0 0 1 2-2.6Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <line x1="16.8" y1="14.4" x2="20.6" y2="20.2"/>
        <line x1="25" y1="13.2" x2="28.8" y2="19"/>
        <line x1="33.2" y1="12" x2="37" y2="17.8"/>
      </g>
      <rect x="9" y="24.5" width="30" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M20.5 28.5v6l5.5-3-5.5-3Z" fill="currentColor"/>
    </symbol>
    <!-- 6 胶片 X 字标 -->
    <symbol id="logo-6" viewBox="0 0 48 48">
      <g stroke="currentColor" stroke-width="8" stroke-linecap="round">
        <line x1="13" y1="11" x2="35" y2="37"/>
        <line x1="35" y1="11" x2="13" y2="37"/>
      </g>
      <g fill="rgb(65,118,230)" class="perf">
        <rect x="16.7" y="16.2" width="4.4" height="4.4" rx="1"/>
        <rect x="26.9" y="27.4" width="4.4" height="4.4" rx="1"/>
        <rect x="26.9" y="16.2" width="4.4" height="4.4" rx="1"/>
        <rect x="16.7" y="27.4" width="4.4" height="4.4" rx="1"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header>
    <h1>MediaAgent-X · Logo 方案</h1>
    <p>六个方向，全部矢量稿：左半为浅色底墨稿 / 深色底反白，卡片内附 24px（侧栏实寸）与 16px 效果。回复编号即可定稿。</p>
  </header>

  <div class="grid" id="grid"></div>

  <div class="mockTitle">侧栏实景（24px + 字标）</div>
  <div class="mockStrip" id="mockStrip"></div>
</div>

<script>
const concepts = [
  { id: 'logo-1', name: '对向播放键', desc: '两个相对的播放三角形，间隙构成 X 负形 ——「媒体」与「X」一图双关，小尺寸最稳。' },
  { id: 'logo-2', name: '调度网络 X ✓ 已定稿', desc: '中心枢纽向四个节点辐射，正是总编调度工种、闸门放行的拓扑；X 由连线自然成形。' },
  { id: 'logo-3', name: '光圈快门', desc: '镜头光圈三叶片，直指「视频制作」本体；几何克制，与界面其他线性图标最协调。' },
  { id: 'logo-4', name: '电波播放', desc: '播放键向外发出两道电波，强调「发布与分发」——覆盖选题到上线的全链路叙事。' },
  { id: 'logo-5', name: '场记板', desc: '打板开拍，一条 run 就是一场开机；识别度最高，但细节在 16px 以下略糊。' },
  { id: 'logo-6', name: '胶片 X 字标', desc: '粗 X 字标嵌四枚蓝色片孔，最「品牌字标」的一版；蓝色片孔固定品牌色（暗色下自动换亮蓝需微调）。' },
]
const grid = document.getElementById('grid')
const strip = document.getElementById('mockStrip')
concepts.forEach((c, i) => {
  const card = document.createElement('div')
  card.className = 'card'
  card.innerHTML = `
    <div class="tiles">
      <div class="tile light"><svg width="96" height="96"><use href="#${c.id}"/></svg></div>
      <div class="tile dark"><svg width="96" height="96"><use href="#${c.id}"/></svg></div>
    </div>
    <div class="meta">
      <h2><span class="num">${i + 1}</span>${c.name}</h2>
      <p>${c.desc}</p>
      <div class="sizes">
        <div><svg width="24" height="24"><use href="#${c.id}"/></svg><span>24px 侧栏</span></div>
        <div><svg width="16" height="16"><use href="#${c.id}"/></svg><span>16px</span></div>
        <div style="color:var(--brand)"><svg width="24" height="24"><use href="#${c.id}"/></svg><span>品牌色</span></div>
      </div>
    </div>`
  grid.appendChild(card)
  const side = document.createElement('div')
  side.className = 'mockSide'
  side.innerHTML = `<svg width="24" height="24"><use href="#${c.id}"/></svg>MediaAgent-X<span class="lbl">方案 ${i + 1}</span>`
  strip.appendChild(side)
})
</script>
</body>
</html>
